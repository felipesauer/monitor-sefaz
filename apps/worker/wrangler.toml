name = "monitor-sefaz"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Deploy: `pnpm --filter @monitor-sefaz/worker exec wrangler deploy`
#   (use `exec wrangler deploy`, não `pnpm deploy` — o pnpm tem um comando
#    nativo `deploy` que intercepta o script). Requer `wrangler login`.
# A SPA aponta para a URL pública deste worker via VITE_API_BASE_URL.

# Coleta agendada: é o que dá memória ao Worker. O cron do GitHub Actions é
# best-effort e entregava ~6 coletas/dia (gap mediano de 4h), o que deixava a
# barra de uptime de 24h com 7 amostras. Aqui são 288/dia.
[triggers]
crons = ["*/5 * * * *"]

# Histórico compacto, numa única chave (ver HistoryStore): 288 escritas/dia
# contra o limite de 1.000/dia do free tier.
#
# Este id aponta para o namespace da conta que hospeda o deploy oficial. Num
# fork, crie o seu e substitua:
#   pnpm --filter @monitor-sefaz/worker exec wrangler kv namespace create HISTORY
[[kv_namespaces]]
binding = "HISTORY"
id = "9707ccc4e6894e0a8a29f9bc56e4d081"
