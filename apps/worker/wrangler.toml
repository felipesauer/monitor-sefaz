name = "monitor-sefaz"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Deploy: `pnpm --filter @monitor-sefaz/worker exec wrangler deploy`
#   (use `exec wrangler deploy`, não `pnpm deploy` — o pnpm tem um comando
#    nativo `deploy` que intercepta o script). Requer `wrangler login`.
# A SPA aponta para a URL pública deste worker via VITE_API_BASE_URL.

# ─────────────────────────────────────────────────────────────────────────────
# HISTÓRICO EM KV — desativado até o namespace existir.
#
# É o que dá memória ao Worker: um Cron Trigger de 5 minutos coleta e acumula
# a série no KV (288 pontos/dia), em vez dos ~6/dia que o cron best-effort do
# GitHub Actions entrega. O código já está pronto e testado; sem o binding, o
# Worker segue stateless, `/history` responde 501 e a SPA usa o JSON estático.
#
# Para ativar, em duas etapas:
#
#   1. Crie o namespace e copie o id que ele imprime:
#        pnpm --filter @monitor-sefaz/worker exec wrangler kv namespace create HISTORY
#
#   2. Descomente os dois blocos abaixo e cole o id em `id = "..."`.
#
# Custo: 288 escritas/dia contra o limite de 1.000/dia do free tier, e uma
# única chave de ~230 KB (ver HistoryStore e o formato compacto em contracts).
# ─────────────────────────────────────────────────────────────────────────────

# [triggers]
# crons = ["*/5 * * * *"]

# [[kv_namespaces]]
# binding = "HISTORY"
# id = "COLE_AQUI_O_ID_DO_NAMESPACE"
