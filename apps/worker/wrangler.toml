name = "monitor-sefaz"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Deploy: `pnpm --filter @monitor-sefaz/worker exec wrangler deploy`
#   (use `exec wrangler deploy`, não `pnpm deploy` — o pnpm tem um comando
#    nativo `deploy` que intercepta o script). Requer `wrangler login`.
# A SPA aponta para a URL pública deste worker via VITE_API_BASE_URL.

# Coleta agendada a cada 5 minutos: é o que dá HISTÓRICO ao Worker.
# O cron do GitHub Actions é best-effort e entregava ~6 coletas/dia; aqui são
# 288, e a barra de uptime passa a enxergar quedas curtas.
[triggers]
crons = ["*/5 * * * *"]

# Histórico compacto (uma única chave, ver HistoryStore). 288 escritas/dia,
# dentro do free tier (1.000/dia).
# Crie o namespace e cole o id abaixo:
#   pnpm --filter @monitor-sefaz/worker exec wrangler kv namespace create HISTORY
[[kv_namespaces]]
binding = "HISTORY"
id = "SUBSTITUA_PELO_ID_DO_NAMESPACE"
