<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Metadados da página (title, description, canonical, Open Graph e
         JSON-LD): vêm de src/lib/seo.ts, e o prerender (scripts/prerender.js)
         os escreve aqui. Sem prerender (no `vite dev`) fica um título provisório. -->
    <!--app-head--><title>Monitor SEFAZ</title><!--/app-head-->

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta name="theme-color" content="#0b1220" />

    <!-- Aplica o tema antes do primeiro paint. A página chega pré-renderizada,
         e esperar o React faria quem usa o tema escuro ver um flash do claro.
         A chave e a regra são as mesmas de src/hooks/useTheme.ts. -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('monitor-sefaz:theme');
        } catch (e) {}
        var dark =
          saved === 'dark' ||
          (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
