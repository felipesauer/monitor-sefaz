name: Coletar status SEFAZ

# Coleta o status das fontes públicas e publica os JSONs no GitHub Pages, SEM
# commit: os dados não entram no histórico do git (o repositório pararia de
# crescer só por causa deles). O estado de uma coleta para a seguinte
# (history.json, technical-notes.json, notifier-state.json) passa pelo cache do
# Actions; o site publicado é a reserva quando o cache está vazio.
#
# Só tem workflow_dispatch, de propósito. Quem dispara é o Cron Trigger do
# Worker (a cada 5 min) e, como rede de segurança, o `collect-schedule.yml`.
# Um workflow com `schedule` é desligado pelo GitHub após 60 dias sem atividade
# no repositório, e desligado ele não atende nem o disparo manual. Sem os
# commits de dados, essa inatividade passa a ser possível.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Uma coleta por vez, inclusive o deploy: a seguinte parte do estado que esta
# deixou no cache.
concurrency:
  group: collect
  cancel-in-progress: false

env:
  DATA_DIR: apps/web/public/data

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restaurar o estado da última coleta
        id: state
        uses: actions/cache/restore@v6
        with:
          path: apps/web/public/data
          key: collect-data-${{ github.run_id }}
          restore-keys: collect-data-

      - name: Usar os dados publicados (cache vazio)
        if: steps.state.outputs.cache-matched-key == ''
        run: bash .github/scripts/restore-published-data.sh "$DATA_DIR"

      - name: Coletar status
        run: pnpm --filter @monitor-sefaz/collector collect "$GITHUB_WORKSPACE/$DATA_DIR"
        env:
          # Teto do history.json publicado (os pontos mais antigos saem primeiro).
          HISTORY_MAX_BYTES: '2000000'
          # Notificações (opcional): definidas como secrets/vars do repositório.
          # Ausentes → o collector é no-op de notificação (nenhum efeito).
          NOTIFY_DISCORD_WEBHOOK_URL: ${{ secrets.NOTIFY_DISCORD_WEBHOOK_URL }}
          NOTIFY_SLACK_WEBHOOK_URL: ${{ secrets.NOTIFY_SLACK_WEBHOOK_URL }}
          NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.NOTIFY_TELEGRAM_BOT_TOKEN }}
          NOTIFY_TELEGRAM_CHAT_ID: ${{ secrets.NOTIFY_TELEGRAM_CHAT_ID }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          NOTIFY_EVENTS: ${{ vars.NOTIFY_EVENTS }}
          NOTIFY_DIGEST_HOUR: ${{ vars.NOTIFY_DIGEST_HOUR }}

      - name: Gravar o histórico no KV do Worker
        # O Worker lê esta chave para servir /history. Se falhar, o Pages ainda
        # publica a rodada; o passo fica marcado para investigar.
        continue-on-error: true
        run: pnpm --filter @monitor-sefaz/collector kv-history "$GITHUB_WORKSPACE/$DATA_DIR"
        env:
          CLOUDFLARE_KV_TOKEN: ${{ secrets.CLOUDFLARE_KV_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # O mesmo namespace do binding HISTORY em apps/worker/wrangler.toml.
          KV_NAMESPACE_ID: 9707ccc4e6894e0a8a29f9bc56e4d081

      - name: Guardar o estado para a próxima coleta
        uses: actions/cache/save@v6
        with:
          path: apps/web/public/data
          key: collect-data-${{ github.run_id }}

      - name: Entregar os dados ao deploy
        uses: actions/upload-artifact@v7
        with:
          name: dados
          path: apps/web/public/data
          retention-days: 1

  deploy:
    needs: collect
    uses: ./.github/workflows/deploy-pages.yml
    with:
      data-artifact: dados
    secrets: inherit
