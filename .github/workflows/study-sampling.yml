name: Estudo — amostragem da disponibilidade

# Amostra as páginas de disponibilidade do SVRS a cada poucos minutos, por até
# ~6 h, para decidir se um documento novo (NF3e, NFCom) tem fonte estável o
# bastante para entrar no monitor. Critério (ADR-21): fetch ok em pelo menos 98%
# das amostras, somando as três janelas, e layout sem mudança.
#
# É ESTUDO, não produção: só roda quando disparado à mão, não usa segredo, não
# commita nada e não toca na coleta. O resultado vai para o resumo do job e para
# um artefato (samples.jsonl + summary.json/md).
on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Duração da amostragem em minutos (o job tem limite de 6 h)'
        default: '345'
      interval_seconds:
        description: 'Intervalo entre rodadas, em segundos'
        default: '300'
      pages:
        description: 'Páginas do SVRS (/<Pagina>/Disponibilidade), separadas por vírgula'
        default: 'Nf3e,Nfcom,Mdfe,Bpe,Cte'

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Amostrar
        run: pnpm --filter @monitor-sefaz/collector sample-availability
        env:
          SAMPLE_DURATION_MIN: ${{ inputs.duration_minutes }}
          SAMPLE_INTERVAL_S: ${{ inputs.interval_seconds }}
          SAMPLE_PAGES: ${{ inputs.pages }}
          SAMPLE_OUT: ${{ runner.temp }}/sampling

      - name: Guardar amostras
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: amostragem-${{ github.run_id }}
          path: ${{ runner.temp }}/sampling
          retention-days: 30
