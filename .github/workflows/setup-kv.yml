name: Provisionar KV do histórico

# Workflow de uso pontual: cria o namespace de KV que o Worker usa para
# acumular o histórico e imprime o id, para ser colado no wrangler.toml.
#
# Existe porque criar o namespace exige credencial da conta Cloudflare, e o
# repositório já tem o secret CLOUDFLARE_API_TOKEN — assim ninguém precisa de
# `wrangler login` local só para provisionar.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    if: github.repository == 'felipesauer/monitor-sefaz'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Namespaces existentes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @monitor-sefaz/worker exec wrangler kv namespace list

      - name: Criar HISTORY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Idempotente na prática: se já existir, o comando falha dizendo isso e
        # o passo anterior já mostrou o id.
        run: pnpm --filter @monitor-sefaz/worker exec wrangler kv namespace create HISTORY
