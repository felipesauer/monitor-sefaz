name: Deploy SPA (GitHub Pages)

# Builda a SPA estática e publica no GitHub Pages. Roda quando o código do front
# muda ou quando o coletor commita novos dados (apps/web/public/data).
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # O lastmod do sitemap é a data do último commit que mudou o site ou o
          # catalog (scripts/prerender.js). Num clone raso, esse commit não
          # existe e o lastmod viraria a data de cada coleta.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build SPA
        # BASE_PATH = "/<repo>/" para Pages de projeto.
        # VITE_API_BASE_URL → SPA consome o Cloudflare Worker ao vivo. A URL vem
        # da variável de repositório WORKER_URL (Settings → Variables); se ausente,
        # cai para os JSONs estáticos versionados.
        # GOOGLE_SITE_VERIFICATION / BING_SITE_VERIFICATION → meta tags de
        # verificação do Search Console e do Bing Webmaster. Valem como secret ou
        # como variável de repositório (o código acaba público no HTML de todo
        # jeito). Aceitam o código ou a <meta> inteira; ausentes, nada muda.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE_URL: ${{ vars.WORKER_URL }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION || vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ secrets.BING_SITE_VERIFICATION || vars.BING_SITE_VERIFICATION }}
        run: pnpm --filter "@monitor-sefaz/web..." build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
