name: Diagnóstico do Worker

# Uso pontual: inspeciona o estado do Worker na conta Cloudflare (schedules
# registrados e chaves no KV). Existe porque o token só está disponível como
# secret do repositório.
on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  ACCOUNT: 2b862d45490666c8ff3d5dc48ed3fcda

jobs:
  inspect:
    runs-on: ubuntu-latest
    if: github.repository == 'felipesauer/monitor-sefaz'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Schedules registrados
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "--- GET .../schedules"
          curl -s -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/monitor-sefaz/schedules" \
            | python3 -m json.tool

      - name: Chaves no KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --filter @monitor-sefaz/worker exec \
            wrangler kv key list --namespace-id 9707ccc4e6894e0a8a29f9bc56e4d081 || true

      - name: Subdomínio / rotas do Worker
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "--- subdomain"
          curl -s -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/monitor-sefaz/subdomain" \
            | python3 -m json.tool || true
